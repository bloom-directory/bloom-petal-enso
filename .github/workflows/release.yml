name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@222557410bf4d45b0fc30feefe779d4234c04097
    with:
      petal-name: enso
      petal-tooling-ref: "222557410bf4d45b0fc30feefe779d4234c04097"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 31
    secrets:
      compile-time-secret: ${{ secrets.ENSO_API_KEY }}
