name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@ec8fe8e445073e4cbef8a62bb27ab88feca32ef6
    with:
      petal-name: enso
      petal-tooling-ref: "ec8fe8e445073e4cbef8a62bb27ab88feca32ef6"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 27
    secrets:
      compile-time-secret: ${{ secrets.ENSO_API_KEY }}
