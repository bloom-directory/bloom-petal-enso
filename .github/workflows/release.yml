name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@47cd4abbaa51aac57014ac1795e2749e32332f2c
    with:
      petal-name: enso
      petal-tooling-ref: "47cd4abbaa51aac57014ac1795e2749e32332f2c"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 31
    secrets:
      compile-time-secret: ${{ secrets.ENSO_API_KEY }}
