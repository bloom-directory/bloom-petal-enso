name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@7dd2722db5de305dd63ca4ed03591f3ab82fa40b
    with:
      petal-name: enso
      petal-tooling-ref: "7dd2722db5de305dd63ca4ed03591f3ab82fa40b"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 31
    secrets:
      compile-time-secret: ${{ secrets.ENSO_API_KEY }}
