name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@4fefa736df67fa1ee51aeaa0c749d2f11414257d
    with:
      petal-name: enso
      petal-tooling-ref: "4fefa736df67fa1ee51aeaa0c749d2f11414257d"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 31
    secrets:
      compile-time-secret: ${{ secrets.ENSO_API_KEY }}
