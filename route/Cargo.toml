[package]
name = "bloom-enso-route"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
alloy = { version = "2", default-features = false, features = ["dyn-abi", "sol-types", "std"] }
hex = "0.4"
petal = { package = "bloom-petal-sdk", git = "https://github.com/bloom-directory/petal", rev = "39bc8476ff055922f52b71a4953ed70004e9c5d3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
url = "2"

[dev-dependencies]
tempfile = "3"
