# Enso-owned advisory preferences; Bloom wallet policy remains host-enforced.
# Defaults cover all 13 Bloom chains with Enso Router V2 deployments.
# Router V2 deployments: https://docs.enso.build/pages/build/reference/deployments.md (verified 2026-09-16)
[mev]
max_slippage_bps = 100

[defi]
enabled = true
allowed_source_chains = ["ethereum", "polygon", "base", "optimism", "arbitrum", "bnb", "avalanche", "gnosis", "linea", "hyperliquid", "robinhood", "arc", "tempo"]
allowed_destination_chains = ["ethereum", "polygon", "base", "optimism", "arbitrum", "bnb", "avalanche", "gnosis", "linea", "hyperliquid", "robinhood", "arc", "tempo"]
allowed_receivers = ["class:wallet_eoa"]
denied_receivers = []
allowed_routers = [
  "ethereum:0xf75584ef6673ad213a685a1b58cc0330b8ea22cf",
  "polygon:0xf75584ef6673ad213a685a1b58cc0330b8ea22cf",
  "base:0xf75584ef6673ad213a685a1b58cc0330b8ea22cf",
  "optimism:0xf75584ef6673ad213a685a1b58cc0330b8ea22cf",
  "arbitrum:0xf75584ef6673ad213a685a1b58cc0330b8ea22cf",
  "bnb:0xf75584ef6673ad213a685a1b58cc0330b8ea22cf",
  "avalanche:0xf75584ef6673ad213a685a1b58cc0330b8ea22cf",
  "gnosis:0xf75584ef6673ad213a685a1b58cc0330b8ea22cf",
  "hyperliquid:0xf75584ef6673ad213a685a1b58cc0330b8ea22cf",
  "linea:0xa146d46823f3f594b785200102be5385cafce9b5",
  "robinhood:0xcfbaa9cfce952ca4f4069874ff1df8c05e37a3c7",
  "arc:0xcfbaa9cfce952ca4f4069874ff1df8c05e37a3c7",
  "tempo:0xcfbaa9cfce952ca4f4069874ff1df8c05e37a3c7",
]
denied_protocols = []
# Missing protocol metadata is surfaced as a warning in the review plan.
allow_unknown_protocols = true
# Router V2 action bytes are not fully decoded. Receiver and minimum-output
# guarantees remain unverified and require operator review before broadcast.
require_calldata_verification = false
