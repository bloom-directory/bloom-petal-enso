schema = "bloom.petal.build.v1"
name = "enso"
routes = "route/files"
output = "petal/enso"

[route_crate]
package = "bloom-enso-route"
path = "route"
alias = "enso_route"

[sdk]
package = "bloom-petal-sdk"
git = "https://github.com/bloom-directory/petal"
rev = "1af3ba971e8b494b58bb85d0c0fcf2ad15cd3b4c"

[dependencies]
alloy = { version = "2", default-features = false, features = ["dyn-abi", "sol-types", "std"] }
hex = "0.4"
serde_json = "1"
